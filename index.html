<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAUTILUS — The Synthesized Mind, Leverage & Biopics Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ["class", '[data-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              background: "var(--bg-primary)",
              card: "var(--bg-card)",
              "background-secondary": "var(--bg-secondary)",
              primary: "var(--text-primary)",
              secondary: "var(--text-secondary)",
              muted: "var(--text-muted)",
              subtle: "var(--border-subtle)",
              hover: "var(--border-hover)",
              "cta-bg": "var(--cta-bg)",
              "cta-text": "var(--cta-text)",
              "cta-hover": "var(--cta-hover)",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body class="bg-background text-primary transition-colors font-sans">
    <!-- Shell: full-viewport flex layout -->
    <div class="layout-shell">
      <!-- Mobile Top Bar -->
      <header class="mobile-topbar">
        <a href="#" class="brand-link interactive">
          <div class="brand-mark">N</div>
          <span class="text-sm font-medium tracking-tight text-primary"
            >NAUTILUS</span
          >
        </a>
        <button
          id="mobile-menu-btn"
          class="p-2 text-muted hover:text-primary transition-colors interactive"
        >
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </header>

      <!-- Sidebar -->
      <aside id="sidebar-nav" class="sidebar">
        <!-- Brand (desktop only) -->
        <div class="sidebar-brand">
          <a href="#" class="brand-link interactive">
            <div class="brand-mark">N</div>
            <div>
              <div class="text-sm font-medium tracking-tight text-primary">
                NAUTILUS
              </div>
            </div>
          </a>
        </div>

        <!-- Scrollable nav body -->
        <div class="sidebar-body no-scrollbar">
          <!-- Search -->
          <div class="relative w-full">
            <i
              data-lucide="search"
              class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted"
            ></i>
            <input
              type="text"
              id="search-input"
              placeholder="Search concepts..."
              class="w-full ui-input text-xs pl-9 pr-4 py-2 focus-ring transition-colors"
            />
          </div>

          <!-- Portals -->
          <div>
            <div class="sidebar-label">Portals</div>
            <div class="sidebar-group" id="portal-switcher">
              <button data-portal="ALL" class="sidebar-item portal-btn active">
                All Sources
              </button>
              <button
                data-portal="HealthyGamerGG"
                class="sidebar-item portal-btn"
              >
                Dr. K (HealthyGamerGG)
              </button>
              <button
                data-portal="Naval Ravikant"
                class="sidebar-item portal-btn"
              >
                Naval Ravikant
              </button>
              <button
                data-portal="Luminaries & Biopics"
                class="sidebar-item portal-btn"
              >
                Luminaries / Biopics
              </button>
            </div>
          </div>

          <!-- Pillar Filters -->
          <div>
            <div class="sidebar-label">Knowledge Pillars</div>
            <div class="sidebar-group" id="pillar-filters">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>

        <!-- Sidebar footer -->
        <div class="sidebar-footer">
          <button
            id="btn-random"
            class="btn-secondary sidebar-action-btn interactive"
            title="Random Article"
          >
            <i data-lucide="shuffle" class="w-4 h-4"></i>
            <span>Random</span>
          </button>
          <button id="theme-toggle" class="sidebar-icon-btn interactive">
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
          </button>
        </div>
      </aside>

      <!-- Mobile Overlay -->
      <div id="mobile-overlay" class="mobile-overlay"></div>

      <!-- Main Content Area -->
      <main class="main-content" id="scroll-container">
        <!-- Reading Progress -->
        <div id="reading-progress" class="reading-progress-bar"></div>

        <div class="content-frame" id="app-container">
          <!-- HOME VIEW -->
          <section id="view-home" class="space-y-10">
            <!-- Page Header -->
            <div
              class="flex flex-col md:flex-row md:items-end justify-between border-b border-subtle pb-6 gap-4"
            >
              <div class="space-y-1">
                <h2
                  class="text-display-hero m-0 leading-tight"
                  id="archive-title"
                >
                  NAUTILUS
                </h2>
                <p class="text-ui-body max-w-xl" id="archive-subtitle">
                  Unified Syntheses across Psychology, Leverage, First
                  Principles & Biopics
                </p>
              </div>
              <div
                class="text-ui-micro shrink-0"
                id="article-count-badge"
              ></div>
            </div>

            <!-- Hero Featured -->
            <article
              id="hero-article"
              class="card-outer card-hover cursor-pointer interactive hidden"
            >
              <!-- Rendered dynamically -->
            </article>

            <!-- Articles List -->
            <div id="articles-grid" class="article-list">
              <!-- Rendered dynamically -->
            </div>
          </section>

          <!-- READER VIEW -->
          <section id="view-reader" class="hidden">
            <!-- Back Bar -->
            <div
              class="flex items-center justify-between mb-8 pb-4 border-b border-subtle"
            >
              <button
                id="btn-back"
                class="inline-flex items-center gap-2 text-ui-micro text-muted hover:text-primary h-8 interactive"
              >
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Return to Archive</span>
              </button>
              <span
                id="reader-pillar-badge"
                class="badge-neutral hidden sm:inline-block"
              ></span>
            </div>

            <div class="reader-layout">
              <!-- Main Column -->
              <article class="reader-main">
                <header class="mb-10 space-y-4 border-b border-subtle pb-8">
                  <div
                    class="flex items-center gap-2 text-ui-micro"
                    id="reader-id"
                  >
                    <div class="status-dot"></div>
                    <span
                      class="text-muted tracking-widest uppercase"
                      id="reader-kb-name"
                    ></span>
                  </div>
                  <h1 id="reader-title" class="text-display-hero m-0"></h1>
                  <div
                    class="flex flex-wrap items-center gap-2 text-ui-micro pt-2"
                    id="reader-author-meta"
                  >
                    <span
                      id="reader-author-name"
                      class="font-medium text-primary badge-neutral"
                    ></span>
                    <span class="text-muted">·</span>
                    <span id="reader-time" class="text-muted"></span>
                  </div>
                </header>
                <div
                  id="reader-body"
                  class="prose prose-nautilus max-w-none"
                ></div>
              </article>

              <!-- Reader Sidebar -->
              <aside class="reader-sidebar">
                <div class="reader-sidebar-sticky">
                  <div class="card-outer space-y-3 p-5">
                    <div
                      class="text-ui-micro tracking-widest uppercase border-b border-subtle pb-2 text-primary font-medium"
                    >
                      Context
                    </div>
                    <p
                      id="reader-target-struggle"
                      class="text-ui-body opacity-80 leading-relaxed"
                    ></p>
                  </div>
                  <div class="card-outer space-y-3 p-5">
                    <div
                      class="text-ui-micro tracking-widest uppercase border-b border-subtle pb-2 text-primary font-medium"
                    >
                      Index
                    </div>
                    <nav id="toc-container" class="toc-nav no-scrollbar"></nav>
                  </div>
                </div>
              </aside>
            </div>
          </section>

          <!-- Footer -->
          <footer class="content-footer">
            <div class="text-sm font-medium tracking-tight text-primary">
              NAUTILUS SYSTEM
            </div>
            <div class="text-ui-micro mt-1">
              High-signal architecture for psychological frameworks and
              leverage.
            </div>
          </footer>
        </div>
      </main>
    </div>

    <script src="articles_db.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
